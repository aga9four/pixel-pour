<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe8d6" />
    <title>Pixel Pour</title>
    <meta name="description" content="Versa il colore, rivela il disegno. Puzzle gratuito con un livello nuovo ogni giorno e sfide tra amici." />
    <meta property="og:title" content="Pixel Pour · Versa il colore, rivela il disegno" />
    <meta property="og:description" content="Un amico ti ha sfidato? Apri e gioca subito dal browser, niente da installare." />
    <meta property="og:image" content="https://aga9four.github.io/pixel-pour/og.png" />
    <meta property="og:url" content="https://aga9four.github.io/pixel-pour/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="icon.png" />
    <!-- Il font Fredoka è incorporato nell'app (@fontsource), niente richieste a Google -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" /><style>:root {
  --bg1: #ffe8d6;
  --bg2: #ffd6e0;
  --ink: #2b2d42;
  --ink-soft: #6b6f86;
  --card: #fffaf2;
  --accent: #ff5d8f;
  --accent2: #7c5cff;
  --gold: #ffc233;
  --ok: #3bb273;
  --shadow: 0 6px 0 rgba(43, 45, 66, 0.18);
  --radius: 18px;
  --banner-h: 0px;
  font-family: 'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2));
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
body.has-banner { --banner-h: 50px; }

#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding-bottom: var(--banner-h);
}

.screen {
  position: absolute;
  inset: 0 0 var(--banner-h) 0;
  display: none;
  flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px 12px;
}
.screen.active { display: flex; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

.btn {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 1.15rem;
  padding: 14px 22px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform 0.08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(43, 45, 66, 0.18); }
.btn:disabled { opacity: 0.5; }
.btn.secondary { background: #fff; color: var(--ink); }
.btn.purple { background: var(--accent2); }
.btn.gold { background: var(--gold); color: var(--ink); }

.icon-btn {
  width: 44px; height: 44px;
  border-radius: 14px;
  background: #fff;
  box-shadow: var(--shadow);
  font-size: 1.3rem;
  font-weight: 700;
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff; border-radius: 999px; padding: 6px 12px;
  box-shadow: var(--shadow); font-size: 1rem;
}

/* ---------- HOME ---------- */
.topbar { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.logo { text-align: center; margin: 18px 0 10px; }
.logo h1 { margin: 0; font-size: 3rem; line-height: 1; letter-spacing: -1px; }
.logo h1 span { color: var(--accent); }
.logo p { margin: 6px 0 0; color: var(--ink-soft); }
.logo-drops { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
.logo-drops i {
  width: 18px; height: 24px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: var(--accent); animation: bob 1.4s ease-in-out infinite;
}
.logo-drops i:nth-child(2) { background: var(--gold); animation-delay: 0.2s; }
.logo-drops i:nth-child(3) { background: #2f7fe0; animation-delay: 0.4s; }
@keyframes bob { 50% { transform: translateY(-6px); } }

.btn-play { align-self: center; min-width: 220px; font-size: 1.5rem; display: flex; flex-direction: column; align-items: center; }
.btn-play small { font-size: 0.85rem; opacity: 0.85; font-weight: 600; }
.daily-card {
  margin-top: 14px; align-self: center; width: 100%; max-width: 360px;
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: #fff; border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow);
}
.daily-card:active { transform: translateY(3px); }
.daily-cal {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 46px; height: 50px; border-radius: 12px; overflow: hidden; background: var(--card);
  border: 2px solid var(--ink); line-height: 1;
}
.daily-cal small { background: var(--accent); color: #fff; width: 100%; text-align: center; font-size: 0.65rem; font-weight: 700; padding: 3px 0; letter-spacing: 1px; }
.daily-cal b { font-size: 1.35rem; padding-top: 4px; }
.daily-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.daily-text small { color: var(--ink-soft); font-size: 0.85rem; }
.daily-card.done .daily-text small { color: var(--ok); font-weight: 600; }
.daily-streak { display: flex; flex-direction: column; align-items: center; font-size: 1.1rem; }
.daily-streak b { font-size: 0.95rem; }
.daily-streak.cold { filter: grayscale(1); opacity: 0.45; }

.loading {
  position: fixed; inset: 0; z-index: 30; background: rgba(255, 240, 230, 0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 600;
}
.loading-drops { display: flex; gap: 8px; }
.loading-drops i { width: 16px; height: 22px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--accent); animation: bob 0.9s ease-in-out infinite; }
.loading-drops i:nth-child(2) { background: var(--gold); animation-delay: 0.15s; }
.loading-drops i:nth-child(3) { background: #2f7fe0; animation-delay: 0.3s; }
.share-seq { font-size: 1.3rem; letter-spacing: 2px; word-break: break-all; margin: 4px 0 8px; }
.countdown { font-size: 0.9rem; color: var(--ink-soft); }
.act em[hidden], .loading[hidden] { display: none; }

.section-title { font-size: 1.1rem; margin: 22px 0 10px; color: var(--ink-soft); }

.level-grid-old {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 12px;
  grid-auto-rows: max-content;
  align-content: start;
  overflow-y: auto;
  padding: 4px 2px 20px;
  flex: 1;
  min-height: 0;
}
.tile {
  aspect-ratio: 1;
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.tile canvas { width: 72%; height: 60%; object-fit: contain; image-rendering: pixelated; }
.tile .num { font-size: 1.6rem; font-weight: 700; color: var(--ink-soft); }
.tile .stars { font-size: 0.7rem; letter-spacing: 1px; margin-top: 4px; }
.tile.locked { background: rgba(255, 255, 255, 0.5); box-shadow: none; }
.tile.locked .num { opacity: 0.4; }
.tile.current { outline: 3px solid var(--accent); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }

/* ---------- GIOCO ---------- */
.hud { display: flex; align-items: center; gap: 10px; }
.hud-title { flex: 1; text-align: center; }
#hud-level { font-weight: 700; font-size: 1.15rem; }
.hud-sub { color: var(--ink-soft); font-size: 0.9rem; }
.hud-sub.over #hud-pours { color: var(--accent); font-weight: 700; }

.board-wrap { position: relative; flex: 1; min-height: 0; margin: 6px 0; }
.board-wrap canvas { position: absolute; inset: 0; touch-action: none; }

.toast {
  position: absolute; left: 50%; top: 8px; transform: translate(-50%, -20px);
  background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px;
  font-weight: 600; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.tutorial {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.95); padding: 8px 14px; border-radius: 14px;
  font-size: 0.95rem; box-shadow: var(--shadow); text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 0.3s; width: max-content; max-width: 92%;
}
.tutorial.show { opacity: 1; }

.palette {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 0 4px;
}
.bottle {
  position: relative; width: 52px; height: 68px;
  border-radius: 14px 14px 18px 18px; background: #fff; box-shadow: var(--shadow);
  display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
  transition: transform 0.12s;
}
.bottle .liquid { position: absolute; left: 5px; right: 5px; bottom: 5px; border-radius: 10px; transition: height 0.2s; }
.bottle .qty {
  position: relative; z-index: 1; margin-bottom: 6px; font-weight: 700; font-size: 1rem;
  color: #fff; text-shadow: 0 0 2px #2b2d42, 0 0 2px #2b2d42, 0 1px 3px #2b2d42;
}
.bottle.selected { transform: translateY(-8px); outline: 3px solid var(--ink); }
.bottle.empty { opacity: 0.35; }
.bottle.hinted { animation: pulse 0.7s infinite; outline: 3px solid var(--gold); }

.actions { display: flex; gap: 10px; justify-content: center; padding-top: 8px; }
.act {
  position: relative; flex: 1; max-width: 120px;
  background: #fff; border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; padding: 8px 4px; font-size: 0.85rem; font-weight: 600;
}
.act:active { transform: translateY(3px); }
.act-ico { font-size: 1.4rem; line-height: 1.2; }
.act em {
  position: absolute; top: -6px; right: -4px; font-style: normal;
  background: var(--accent2); color: #fff; min-width: 22px; height: 22px; border-radius: 11px;
  font-size: 0.75rem; display: flex; align-items: center; justify-content: center; padding: 0 5px;
}
.act em.ad { background: var(--gold); color: var(--ink); }
.act.attention { animation: pulse 0.6s infinite; outline: 3px solid var(--accent); }

/* ---------- MODALE ---------- */
.modal {
  position: fixed; inset: 0; background: rgba(43, 45, 66, 0.35);
  display: none; align-items: flex-end; justify-content: center; z-index: 20;
}
.modal.show { display: flex; }
.modal-card {
  width: 100%; max-width: 520px; background: var(--card);
  border-radius: 26px 26px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
  text-align: center; animation: up 0.3s ease-out;
}
@keyframes up { from { transform: translateY(100%); } }
.modal-card h2 { margin: 0 0 4px; font-size: 1.6rem; }
.modal-card p { margin: 4px 0 14px; color: var(--ink-soft); }
.modal-stars { font-size: 2.4rem; letter-spacing: 6px; margin: 4px 0; }
.modal-stars .off { filter: grayscale(1); opacity: 0.3; }
.modal-stars span { display: inline-block; animation: pop 0.4s backwards; }
.modal-stars span:nth-child(2) { animation-delay: 0.15s; }
.modal-stars span:nth-child(3) { animation-delay: 0.3s; }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.3); } }
.modal-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.modal-row .btn { flex: 1; min-width: 130px; font-size: 1rem; }
.reward { font-size: 1.3rem; font-weight: 700; margin: 6px 0; }
.badge-new { display: inline-block; background: var(--gold); padding: 2px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }

/* ---------- ADS (mock) ---------- */
.banner {
  position: fixed; left: 0; right: 0; bottom: 0; height: 50px;
  display: none; align-items: center; justify-content: center;
  background: #e9e9ef; color: #9a9aad; font-size: 0.75rem; letter-spacing: 1px;
  border-top: 1px solid #d5d5de; z-index: 5;
}
body.has-banner .banner { display: flex; }
.ad-overlay {
  position: fixed; inset: 0; background: #111; z-index: 50;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.ad-box { text-align: center; padding: 20px; }
.ad-tag { font-size: 0.75rem; letter-spacing: 2px; opacity: 0.6; }
.ad-title { font-size: 1.3rem; margin: 12px 0; }
.ad-count { font-size: 2.5rem; font-weight: 700; margin: 18px 0; }
.ad-close { background: #fff; color: #111; }

/* ---------- NEGOZIO ---------- */
.pill-btn { cursor: pointer; }
.pill-btn i { font-style: normal; background: var(--ok); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; }
.shop-list { overflow-y: auto; flex: 1; min-height: 0; padding: 10px 2px 24px; display: flex; flex-direction: column; gap: 10px; }
.shop-section { font-weight: 700; color: var(--ink-soft); margin: 10px 0 2px; }
.shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.shop-item {
  background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
}
.shop-item.wide { grid-column: 1 / -1; flex-direction: row; text-align: left; }
.shop-item.wide .shop-name { flex: 1; }
.shop-item canvas { width: 56px; height: 56px; }
.shop-swatch { width: 56px; height: 56px; border-radius: 14px; border: 2px solid rgba(43, 45, 66, 0.15); }
.shop-name { font-weight: 600; }
.shop-name small { display: block; font-weight: 500; color: var(--ink-soft); font-size: 0.8rem; }
.shop-item .btn { font-size: 0.95rem; padding: 8px 14px; width: 100%; }
.shop-item.wide .btn { width: auto; }
.shop-item .btn.in-use { background: var(--ok); }
.choice-row { display: flex; flex-direction: column; gap: 10px; }

/* ---------- TEMI ---------- */
body.theme-mint { --bg1: #dff7ec; --bg2: #c9ecf2; --accent: #1fb5a8; }
body.theme-lavender { --bg1: #ece4ff; --bg2: #ffd9ef; --accent: #9b5de5; }
body.theme-night { --bg1: #1f2344; --bg2: #3b2c5e; --accent: #ff6f9a; }
body.theme-night .logo h1,
body.theme-night .logo p,
body.theme-night .section-title,
body.theme-night .hud-title,
body.theme-night .hud-sub { color: #f4f1ff; }
body.theme-night .logo h1 span { color: var(--accent); }

.icon-btn.off { opacity: 0.45; }
#shop-title { font-weight: 700; font-size: 1.15rem; }
body.theme-night .shop-section { color: #cfc8ef; }

/* ---------- COLLEZIONE A CAPITOLI ---------- */
#level-grid { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 0; padding: 4px 2px 20px; }
.chapter { background: rgba(255, 255, 255, 0.55); border-radius: 18px; padding: 8px; }
.chapter.locked { opacity: 0.6; }
.chapter-head { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 4px 6px; }
.ch-num {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.ch-title { flex: 1; font-weight: 700; display: flex; flex-direction: column; }
.ch-title small { font-weight: 500; color: var(--ink-soft); font-size: 0.8rem; }
.ch-arrow { font-size: 1.1rem; color: var(--ink-soft); }
.level-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; padding: 8px 4px 4px; }
.credits { font-size: 0.75rem; color: var(--ink-soft); text-align: center; margin: 18px 8px 0; }
body.theme-night .credits { color: #cfc8ef; }
.toast { white-space: normal; text-align: center; max-width: 88%; width: max-content; }

/* ---------- HOME: crea / codice ---------- */
.home-row { display: flex; gap: 10px; margin-top: 10px; align-self: center; width: 100%; max-width: 360px; }
.mini-card {
  flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center;
  background: #fff; border-radius: 14px; padding: 9px 10px; box-shadow: var(--shadow); font-size: 0.95rem;
}
.mini-card:active { transform: translateY(3px); }
.mini-card span { font-size: 1.2rem; }
.logo { margin: 10px 0 8px; }
.logo h1 { font-size: 2.6rem; }
.section-title { margin: 14px 0 8px; }

/* ---------- EDITOR ---------- */
.ed-name {
  flex: 1; min-width: 0; font: inherit; font-weight: 600; font-size: 1rem; text-align: center;
  border: 0; border-radius: 12px; padding: 10px; background: #fff; box-shadow: var(--shadow); color: var(--ink);
}
.ed-bar { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.chip { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 600; box-shadow: var(--shadow); }
.chip.on { background: var(--ink); color: #fff; }
.ed-canvas-wrap { position: relative; flex: 1; min-height: 0; margin: 8px 0; }
.ed-canvas-wrap canvas { position: absolute; inset: 0; touch-action: none; }
.ed-palette { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 4px 0; }
.ed-swatch {
  width: 42px; height: 42px; border-radius: 12px; border: 3px solid rgba(255,255,255,0.9);
  box-shadow: var(--shadow); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px;
}
.ed-swatch small { font-size: 0.55rem; background: rgba(255,255,255,0.85); border-radius: 4px; padding: 0 3px; }
.ed-swatch.on { outline: 3px solid var(--ink); transform: translateY(-4px); }
.ed-swatch.add { background: #fff; font-size: 1.4rem; font-weight: 700; align-items: center; color: var(--ink-soft); }
.act.on { outline: 3px solid var(--ink); }
.act-go { background: var(--accent); color: #fff; }
.picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; justify-items: center; margin: 8px 0 12px; }
.code-box {
  font-family: ui-monospace, monospace; font-size: 0.85rem; word-break: break-all; user-select: text; -webkit-user-select: text;
  background: #fff; border: 2px dashed var(--ink-soft); border-radius: 12px; padding: 10px; margin: 6px 0 10px;
}
.code-input {
  width: 100%; min-height: 90px; font: inherit; font-size: 0.9rem; border-radius: 12px; border: 2px solid var(--ink-soft);
  padding: 10px; resize: none; user-select: text; -webkit-user-select: text;
}
.mine-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; text-align: left; margin: 8px 0; }
.mine-item { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 8px; }
.mine-item canvas { width: 40px; height: 40px; image-rendering: pixelated; border-radius: 6px; }
.mine-item .mi-name { flex: 1; font-weight: 600; }
.mine-item .mi-name small { display: block; font-weight: 500; color: var(--ink-soft); }
.mine-item button { background: var(--card); border-radius: 10px; padding: 6px 10px; font-size: 1rem; }
body.theme-night .ed-name { color: var(--ink); }

/* ---------- EVENTI ---------- */
.event-card {
  margin-top: 10px; align-self: center; width: 100%; max-width: 360px;
  display: flex; align-items: center; gap: 12px; text-align: left; color: #fff;
  background: linear-gradient(120deg, var(--ev-accent, #e07a2f), var(--accent)); border-radius: var(--radius);
  padding: 10px 14px; box-shadow: var(--shadow);
}
.event-card[hidden] { display: none; }
.event-card .daily-text small { color: rgba(255,255,255,0.9); }
.ev-emoji { font-size: 1.9rem; }
.ev-prog { font-weight: 700; background: rgba(255,255,255,0.25); border-radius: 999px; padding: 4px 10px; }
.ev-desc { text-align: center; color: var(--ink-soft); margin: 10px 8px 4px; }
.ev-reward { text-align: center; font-weight: 600; margin: 4px 0 8px; }
.ev-reward .btn { margin-top: 6px; }
.ev-tiles { overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
body.theme-night .ev-desc { color: #cfc8ef; }
#evs-title { font-weight: 700; font-size: 1.1rem; }
/* La home scorre tutta insieme (su schermi bassi la collezione non resta schiacciata) */
#screen-home { overflow-y: auto; -webkit-overflow-scrolling: touch; }
#screen-home > * { flex-shrink: 0; }
#screen-home #level-grid { flex: none; overflow: visible; min-height: auto; }

/* Statistiche di gioco */
.stats-btn { margin-top: 14px; width: 100%; }
table.stats { width: 100%; border-collapse: collapse; font-size: 14px; margin: 4px 0 8px; }
table.stats td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(43, 45, 66, 0.08); }
table.stats td:last-child { text-align: right; font-weight: 700; }

.store-card { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 12px 14px; border-radius: 18px; background: #2b2d42; color: #fff; text-decoration: none; flex-wrap: wrap; }
.store-card[hidden] { display: none; }
.store-card span { font-size: 22px; } .store-card small { opacity: .75; width: 100%; margin-left: 32px; margin-top: -6px; }
</style>
  </head>
  <body>
    <div id="app">
      <!-- HOME / MAPPA LIVELLI -->
      <section id="screen-home" class="screen active">
        <header class="topbar">
          <div class="pill"><span>⭐</span><b id="home-stars">0</b></div>
          <button class="pill pill-btn" id="btn-shop" aria-label="Negozio"><span>🪙</span><b id="home-coins">0</b><i>＋</i></button>
          <button class="icon-btn" id="btn-music" aria-label="Musica">🎵</button>
