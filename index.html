<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffdf9">
<title>Knock It Off!</title>
    <meta name="description" content="Il gatto butta giù tutto: dal tavolo al multiverso. Idle gratuito con una sfida di fisica nuova ogni giorno." />
    <meta property="og:title" content="Knock It Off! · Il gatto distruttore" />
    <meta property="og:description" content="Quanto caos riesci a fare oggi? Gioca subito dal browser, niente da installare." />
    <meta property="og:image" content="https://aga9four.github.io/pixel-pour/og.png" />
    <meta property="og:url" content="https://aga9four.github.io/pixel-pour/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="icon.png" />
<style>:root {
  --ink: #3a2412; --ink2: #7a5a40; --cream: #fff7ec; --paper: #fffdf9; --line: #ecdcc6;
  --orange: #f3862b; --orange-d: #c9651a; --ad: #7b4dff; --ad-d: #5a32d6; --teal: #16a394; --teal-d: #0f7a6f;
  --gold: #ffc53d; --red: #e5484d; --ok: #2f9e44;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #2a1a0e; color: var(--ink); overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
#app { position: relative; display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; background: var(--cream); }

/* header */
#top { padding: 10px 14px 8px; background: var(--paper); border-bottom: 2px solid var(--line); z-index: 2; }
#top .row1 { display: flex; align-items: center; gap: 8px; }
#chaos { flex: 1; font-size: 30px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.05; font-variant-numeric: tabular-nums; }
#chaos small { font-size: 14px; font-weight: 700; color: var(--ink2); margin-left: 4px; }
#cps { font-size: 13px; font-weight: 700; color: var(--ink2); font-variant-numeric: tabular-nums; }
#cps .mult { color: var(--ad); margin-left: 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--cream); border: 2px solid var(--line); font-size: 18px; display: grid; place-items: center; }
#zoneBar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; }
#zoneBar .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
#zoneBar .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius: 99px; transition: width .3s; }
#zoneNext { color: var(--ink2); font-weight: 700; }

/* scene */
#scene { position: relative; height: clamp(190px, 36dvh, 360px); flex: 0 0 auto; overflow: hidden; touch-action: manipulation; cursor: pointer; }
#sceneCv { display: block; }
#hint { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-weight: 900; font-size: 17px; color: #fff;
  text-shadow: 0 2px 0 rgba(58,36,18,.8), 0 0 12px rgba(58,36,18,.5); pointer-events: none; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
#ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: rgba(58,36,18,.82); color: #ffe9c7; font-size: 12px; font-weight: 700;
  overflow: hidden; white-space: nowrap; pointer-events: none; }
#ticker span { display: inline-block; padding-left: 100%; line-height: 24px; animation: tick 16s linear infinite; }
#ticker b { color: var(--gold); margin-right: 6px; }
@keyframes tick { to { transform: translateX(-100%); } }
#fish { position: absolute; font-size: 36px; width: 56px; height: 56px; display: none; filter: drop-shadow(0 0 10px #ffd84a) drop-shadow(0 0 4px #fff3b0);
  animation: fishwig .5s ease-in-out infinite alternate; z-index: 3; }
@keyframes fishwig { from { transform: rotate(-12deg) scale(1); } to { transform: rotate(12deg) scale(1.12); } }

/* actions */
#actions { display: grid; grid-template-columns: 1.25fr 1.25fr .7fr; gap: 8px; padding: 8px 10px; background: var(--paper); border-bottom: 2px solid var(--line); }
.act { border-radius: 14px; padding: 7px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50px;
  background: var(--cream); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); transition: transform .06s; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.act b { font-size: 15px; font-weight: 900; }
.act small { font-size: 10.5px; font-weight: 700; opacity: .85; margin-top: 1px; white-space: nowrap; }
.act.ad { background: var(--ad); color: #fff; border-color: var(--ad-d); box-shadow: 0 3px 0 var(--ad-d); }
.act.ad.on { background: linear-gradient(90deg, var(--ad), #b04dff); }
.act.daily { background: var(--teal); color: #fff; border-color: var(--teal-d); box-shadow: 0 3px 0 var(--teal-d); position: relative; }
.act.daily.done { background: #d9efe9; color: var(--teal-d); border-color: #b5ddd3; box-shadow: 0 3px 0 #b5ddd3; }
.act .dot { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); border: 2px solid #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.25); } }

/* tabs + list */
#tabs { display: flex; gap: 6px; padding: 8px 10px 0; background: var(--cream); }
#tabs button[data-tab] { flex: 1; padding: 8px 4px; border-radius: 12px 12px 0 0; font-weight: 800; font-size: 13px; color: var(--ink2); background: #f3e6d3; }
#tabs button.on { background: var(--paper); color: var(--ink); box-shadow: 0 -2px 0 var(--orange) inset; }
#buyMode { padding: 6px 10px; border-radius: 10px; font-weight: 900; font-size: 13px; background: var(--ink); color: #fff; align-self: center; min-width: 50px; }
#list { flex: 1 1 auto; overflow-y: auto; background: var(--paper); padding: 6px 10px 12px; -webkit-overflow-scrolling: touch; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; margin-top: 6px; background: var(--cream); border: 2px solid var(--line); }
.item.locked { opacity: .45; filter: grayscale(.8); }
.item .ic { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; background: #fff; display: grid; place-items: center; font-size: 26px; border: 2px solid var(--line); position: relative; }
.item .ic .n { position: absolute; bottom: -6px; right: -6px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 900; border-radius: 99px; padding: 1px 6px; min-width: 20px; text-align: center; }
.item .mid { flex: 1; min-width: 0; }
.item .nm { font-weight: 850; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ds { font-size: 11.5px; color: var(--ink2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ds .ms { color: var(--orange-d); font-weight: 800; }
.buy { min-width: 86px; padding: 8px 8px; border-radius: 12px; background: var(--orange); color: #fff; font-weight: 900; font-size: 13px; line-height: 1.1;
  box-shadow: 0 3px 0 var(--orange-d); text-align: center; }
.buy small { display: block; font-size: 10px; opacity: .9; font-weight: 800; }
.buy:disabled { background: #d8c9b6; box-shadow: 0 3px 0 #bfae98; color: #fff; cursor: default; }
.buy:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 var(--orange-d); }
.lives { padding: 14px 6px; text-align: center; }
.lives h3 { margin: 6px 0 4px; font-size: 20px; }
.lives p { margin: 0 0 12px; color: var(--ink2); font-weight: 600; font-size: 14px; }
.lives .big { font-size: 40px; font-weight: 900; }
.lives .row { display: flex; justify-content: space-around; margin: 10px 0 16px; }
.lives .row div { font-size: 12px; font-weight: 700; color: var(--ink2); }
.lives .row b { display: block; font-size: 26px; color: var(--ink); }

.btn { display: block; width: 100%; padding: 13px 12px; border-radius: 14px; font-weight: 900; font-size: 16px; background: var(--orange); color: #fff; box-shadow: 0 4px 0 var(--orange-d); margin-top: 10px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--orange-d); }
.btn.ad { background: var(--ad); box-shadow: 0 4px 0 var(--ad-d); }
.btn.teal { background: var(--teal); box-shadow: 0 4px 0 var(--teal-d); }
.btn.ghost { background: transparent; color: var(--ink2); box-shadow: none; font-size: 14px; padding: 8px; }
.btn:disabled { background: #d8c9b6; box-shadow: 0 4px 0 #bfae98; }

#bannerMock { display: flex; height: 50px; flex: 0 0 50px; align-items: center; justify-content: center; background: #efe7dc; color: #a39380; font-size: 11px; font-weight: 800; letter-spacing: 1px; border-top: 1px solid var(--line); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(30,18,8,.6); display: none; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
#modal.show { display: flex; animation: fade .15s; }
#modal .card { width: 100%; max-width: 380px; max-height: 92dvh; overflow-y: auto; background: var(--paper); border-radius: 22px; padding: 20px 18px 14px; text-align: center;
  box-shadow: 0 10px 0 rgba(0,0,0,.15); animation: pop .25s cubic-bezier(.3,1.6,.5,1); }
#modal h2 { margin: 2px 0 6px; font-size: 22px; font-weight: 900; }
#modal p { margin: 6px 0; color: var(--ink2); font-weight: 600; }
#modal .hero { font-size: 54px; line-height: 1.1; }
#modal .num { font-size: 32px; font-weight: 900; color: var(--ink); }
#modal .grid { font-size: 20px; line-height: 1.25; letter-spacing: 1px; margin: 10px 0; word-break: break-all; }
#modal .stars { font-size: 30px; }
#modal .srow { display: flex; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
#modal .srow span:last-child { font-weight: 900; }
#modal .opts { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
#modal .opts button { padding: 8px 14px; border-radius: 10px; background: var(--cream); border: 2px solid var(--line); font-weight: 800; }
#modal .opts button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* daily challenge */
#daily { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #fff1dc; max-width: 560px; margin: 0 auto; }
#daily.show { display: flex; }
#daily .dh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--paper); border-bottom: 2px solid var(--line); }
#daily .dh .t { flex: 1; font-weight: 900; font-size: 17px; }
#daily .dh .t small { display: block; font-size: 11.5px; color: var(--ink2); font-weight: 700; }
#daily .pill { background: var(--cream); border: 2px solid var(--line); border-radius: 99px; padding: 4px 10px; font-weight: 900; font-size: 14px; white-space: nowrap; }
#dailyWrap { position: relative; flex: 1; overflow: hidden; touch-action: none; }
#dailyCv { display: block; touch-action: none; }
#dailyHint { position: absolute; left: 12px; right: 12px; top: 10px; text-align: center; font-weight: 800; font-size: 14px; color: var(--ink2); pointer-events: none; }
#dailyFoot { padding: 8px 12px 12px; background: var(--paper); border-top: 2px solid var(--line); display: none; }
#dailyFoot.show { display: block; }
#dailyFoot .btn { margin-top: 6px; }

/* ad mock + toast */
#adMock { position: fixed; inset: 0; z-index: 50; background: #111; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px; }
#adMock.show { display: flex; }
#adMock .title { font-weight: 900; font-size: 20px; }
#adMock .sub { opacity: .7; font-size: 14px; }
#adMock .count { font-size: 64px; font-weight: 900; color: var(--gold); }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 99px;
  font-weight: 800; font-size: 14px; opacity: 0; transition: .25s; z-index: 60; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* banner nativo (AdMob): spazio riservato, alto quanto l'annuncio adattivo */
#bannerMock.native { height: var(--banner-h, 60px); flex-basis: var(--banner-h, 60px); background: var(--paper); border-top: 0; }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="row1">
      <div id="chaos">0</div>
      <button id="statsBtn" class="iconbtn" aria-label="Stats">📊</button>
      <button id="menuBtn" class="iconbtn" aria-label="Settings">⚙️</button>
    </div>
    <div id="cps"></div>
    <div id="zoneBar"><span id="zoneName"></span><div class="bar"><i id="zoneFill"></i></div><span id="zoneNext"></span></div>
  </header>
  <div id="scene">
    <canvas id="sceneCv"></canvas>
    <div id="hint"></div>
    <button id="fish" aria-label="Golden fish">🐟</button>
    <div id="ticker"><span></span></div>
  </div>
  <div id="actions">
    <button id="boostBtn" class="act ad"><b>📺 x2</b><small id="boostSub"></small></button>
    <button id="dailyBtn" class="act daily"><b id="dailyLbl"></b><small id="dailySub"></small></button>
    <button id="shareBtn" class="act"><b>📤</b><small id="shareSub"></small></button>
  </div>
  <nav id="tabs">
    <button data-tab="gens" class="on"></button>
    <button data-tab="upg"></button>
    <button data-tab="lives"></button>
    <button id="buyMode">x1</button>
  </nav>
  <div id="list"></div>
  <div id="bannerMock">AD · BANNER 320×50</div>
</div>

<div id="daily">
  <div class="dh">
    <button id="dailyClose" class="iconbtn" aria-label="Back">✕</button>
    <div class="t"><span id="dTitle"></span><small id="dSub"></small></div>
    <span class="pill" id="dPaws"></span>
    <span class="pill" id="dScore"></span>
  </div>
  <div id="dailyWrap"><canvas id="dailyCv"></canvas><div id="dailyHint"></div></div>
  <div id="dailyFoot"></div>
</div>

<div id="modal"><div class="card"></div></div>
<div id="adMock"><div class="title"></div><div class="sub"></div><div class="count"></div></div>
<div id="toast"></div>
